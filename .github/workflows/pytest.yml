name: pytest

# PPA-1577. The suite under scripts/tests/ covers the scripts the callable
# workflows run. PyYAML is the one import beyond pytest: a test loads
# merge-close-out.yml to check the env its close-out step passes.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest pyyaml

      - name: Run the suite
        run: python3 -m pytest scripts/ -v

      # PPA-1743. The plugin's hooks read scripts/ from the peech-ci-workflows
      # clone under ~/Documents/Claude-Projects and abort collection without
      # it, so the runner links this checkout there. Mirrors PPA-1605.
      - name: Link this checkout where the hooks read it
        run: |
          mkdir -p "$HOME/Documents/Claude-Projects"
          ln -s "$GITHUB_WORKSPACE" "$HOME/Documents/Claude-Projects/peech-ci-workflows"

      - name: Run the plugin suite
        working-directory: plugins/pt-automation-hooks
        run: python3 -m pytest tests/ -v
