name: pytest

# PPA-1577. The suite under scripts/tests/ covers the scripts the callable
# workflows run. PyYAML is the one import beyond pytest: a test loads
# merge-close-out.yml to check the env its close-out step passes.

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest pyyaml

      - name: Run the suite
        run: python3 -m pytest scripts/ -v
