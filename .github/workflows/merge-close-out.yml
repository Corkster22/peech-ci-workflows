name: Merge Close-Out — Record

# PPA-1577. The merge close-out peech-pmo-automation runs on its own merges,
# served as a callable workflow so a caller repository stops carrying copies of
# scripts/pr_merge_close_out.py and scripts/pt_transition.py. The caller runs
# this on push to main and passes its own Jira pair; no secret is stored here.
#
# Every rule this workflow applies lives in scripts/pr_merge_close_out.py, with
# its own pytest coverage under scripts/tests/. Nothing is decided in YAML: a
# rule expressed in a workflow step cannot be unit-tested.
#
# The caller's file must itself be .github/workflows/merge-close-out.yml, on
# push to main or on its schedule. The github context of a called workflow is
# the caller's, and pt_transition.merge_close_out_run() reads
# GITHUB_WORKFLOW_REF, GITHUB_EVENT_NAME and GITHUB_REF to recognise a close-out
# run, so a caller under another name or trigger, or a manual dispatch, is
# refused the In Progress to Done hop.
#
# PPA-1614. The re-grade runs when a caller passes `regrade: true` from its
# schedule trigger, as `regrade: ${{ github.event_name == 'schedule' }}`. Each
# job takes exactly one value of that input, so one caller file serves both.
#
# PPA-1616. This repository closes out its own merges by running this file
# directly on push to main, under its own JIRA_EMAIL and JIRA_API_TOKEN
# repository secrets. The two checkouts then both land on this repository, as
# they would for a caller. `inputs` is empty on a push, so the close-out job
# runs and the re-grade job is skipped; no re-grade is scheduled here, because
# peech-pmo-automation's hourly sweep already covers every held PPA ticket.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      # The channel id a held notice posts to (PPA-1601). Optional: with no
      # channel, or no SLACK_BOT_TOKEN, the notice is a reported skip and the
      # routing is unchanged.
      slack_channel:
        type: string
        required: false
        default: ""
      # PPA-1614. True runs the re-grade sweep instead of a close-out. The
      # sweep finds its own keys, so it needs no merge to read.
      regrade:
        type: boolean
        required: false
        default: false
    secrets:
      JIRA_EMAIL:
        required: true
      JIRA_API_TOKEN:
        required: true
      # The held-at-In-Progress notice posts with this token through Slack's
      # chat.postMessage. Without it the notice is a reported skip and the
      # routing is unchanged, so the token is optional.
      SLACK_BOT_TOKEN:
        required: false

jobs:
  close-out:
    name: Comment the hash and transition
    if: ${{ !inputs.regrade }}
    runs-on: ubuntu-latest

    steps:
      # The caller repository at the merge commit, at the workspace root: the
      # script reads the merge message and hash from git in its working
      # directory.
      - name: Checkout the caller repository
        uses: actions/checkout@v6

      - name: Checkout peech-ci-workflows
        uses: actions/checkout@v6
        with:
          repository: Corkster22/peech-ci-workflows
          ref: main
          path: .peech-ci-workflows

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pt_transition.py holds one absolute credential path by design
      # (PPA-1126: one .env is one place to rotate a token), and this workflow
      # calls that script rather than reimplementing it, so the path has to
      # exist on the runner. This step copies the two secrets the caller passed
      # into the file the script reads, and nothing else. GitHub masks a secret
      # in the log on its own.
      - name: Materialise the credential file pt_transition.py reads
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${JIRA_EMAIL}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "JIRA_EMAIL or JIRA_API_TOKEN was not passed by the caller"
            exit 1
          fi
          target="${HOME}/Documents/Claude-Projects/peech-pmo-automation/secrets"
          mkdir -p "${target}"
          umask 077
          {
            printf 'JIRA_EMAIL=%s\n' "${JIRA_EMAIL}"
            printf 'JIRA_API_TOKEN=%s\n' "${JIRA_API_TOKEN}"
          } > "${target}/.env"
          echo "wrote ${target}/.env"

      # The commit message is read from git inside the script and never
      # interpolated into this shell, so nothing a commit message contains can
      # be expanded or executed here. Run from the caller's root, so git reads
      # the caller's merge.
      - name: Close out every PPA key the merge carried, and report any it does not
        # The channel comes from the caller's slack_channel input rather than
        # vars, so which repository's variables a called workflow reads does
        # not matter. notify_held() skips an unset channel or token, and a
        # failed post is reported as "notice not sent"; the routing is
        # unchanged either way. On this repository's own push no input is
        # passed, so the channel falls back to this repository's
        # SLACK_CHANNEL_DELIVERY_OPS secret (PPA-1617); a caller's input
        # still wins.
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_DELIVERY_OPS: ${{ inputs.slack_channel || secrets.SLACK_CHANNEL_DELIVERY_OPS }}
        run: python .peech-ci-workflows/scripts/pr_merge_close_out.py

  regrade-held:
    name: Re-grade every ticket a merge left held
    if: ${{ inputs.regrade }}
    runs-on: ubuntu-latest

    steps:
      # No caller checkout: the sweep reads no merge, only Jira.
      - name: Checkout peech-ci-workflows
        uses: actions/checkout@v6
        with:
          repository: Corkster22/peech-ci-workflows
          ref: main
          path: .peech-ci-workflows

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # The close-out job's step, unchanged; see the note there.
      - name: Materialise the credential file pt_transition.py reads
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${JIRA_EMAIL}" ] || [ -z "${JIRA_API_TOKEN}" ]; then
            echo "JIRA_EMAIL or JIRA_API_TOKEN was not passed by the caller"
            exit 1
          fi
          target="${HOME}/Documents/Claude-Projects/peech-pmo-automation/secrets"
          mkdir -p "${target}"
          umask 077
          {
            printf 'JIRA_EMAIL=%s\n' "${JIRA_EMAIL}"
            printf 'JIRA_API_TOKEN=%s\n' "${JIRA_API_TOKEN}"
          } > "${target}/.env"
          echo "wrote ${target}/.env"

      # PPA-1556. plan_transition() owns the rule, as it does for the
      # close-out. No Slack env is passed: the re-grade sends no notice.
      - name: Re-grade the held set
        run: python .peech-ci-workflows/scripts/pr_merge_close_out.py --regrade
